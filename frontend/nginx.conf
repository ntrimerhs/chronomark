server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # pdf.js loads its parser as an ES module worker. nginx has no built-in
    # mapping for .mjs, so it would be served as application/octet-stream and the
    # browser would refuse to instantiate the worker ("Could not load this PDF").
    #
    # A dedicated location, NOT a `types { }` block: declaring types at server
    # level replaces the inherited mime.types list instead of extending it, which
    # also turned index.html into application/octet-stream.
    location ~* \.mjs$ {
        default_type application/javascript;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Single-page app: every unknown path falls back to index.html so
    # /upload and other routes survive a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references hashed asset bundles; it must always be
    # revalidated, otherwise a deploy looks invisible until the browser
    # decides to re-fetch it (the bundles keep their 7d cache, their names
    # change with their content).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
