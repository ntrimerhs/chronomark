# ChronoMark full stack -- server edition.
#
#   backend  - FastAPI + ffmpeg. Qdrant Cloud and Cloudflare R2 come from
#              backend/.env (QDRANT_URL/QDRANT_API_KEY, R2_*), so no vectors
#              and no videos are stored on this machine: videos upload straight
#              from the browser to R2 and the pipeline streams them back from R2.
#   frontend - nginx serving the built SPA
#
#   docker compose up -d --build
#
# The API listens on the host at :37712 (container stays :8000 internally).
# The frontend bakes the API address into the bundle at build time; set
# VITE_API_URL in the .env next to THIS file when the stack is reachable under
# a VPS domain/IP rather than localhost.

services:
  backend:
    build: ./backend
    container_name: chronomark-backend
    # API keys and service URLs come from backend/.env (DEEPSEEK_API_KEY,
    # GROQ_API_KEY, QDRANT_URL, QDRANT_API_KEY, R2_*). The file is never copied
    # into the image (see backend/.dockerignore).
    env_file:
      - ./backend/.env
    ports:
      # Host 37712 -> container 8000 (uvicorn binds 8000 inside).
      - "37712:8000"
    volumes:
      # Derived artifacts only: WAV audio and OCR/scrubber frames. Videos live
      # in R2; a transient processing fallback copy goes to the container's tmp.
      - ./backend/audio:/app/audio
      - ./backend/frames:/app/frames
      # Extracted page texts for uploaded documents (metadata only; the files
      # themselves live in R2 under documents/).
      - ./backend/documents:/app/documents
      # Conversation history per document, so chats survive a rebuild.
      - ./backend/chats:/app/chats
      # Hugging Face model cache (MiniLM, CLIP): downloaded once, reused across
      # rebuilds. ~2 GB -- on a 4 GB VPS keep an eye on disk.
      - ./cookies.txt:/app/cookies.txt
      # Google Document AI service account. Read-only, never baked into the
      # image (see backend/.dockerignore) and never committed (.gitignore):
      # losing this file only turns the PDF path back into pypdf.
      - ./backend/secrets:/app/secrets:ro
      # The worker is a separate process: the queue, the status files and the
      # uploads it picks up all live on directories both can see.
      - ./backend/uploads:/app/uploads
      - ./backend/queue:/app/queue
      - ./backend/jobs:/app/jobs
      - hf_cache:/cache/huggingface
    restart: unless-stopped

  # Ingestion only, and there can be more than one: the queue claim is an atomic
  # rename, so replicas never take the same job. Each worker runs one job at a
  # time (WORKER_CONCURRENCY=1) so a single heavy video cannot starve the others.
  #
  #   docker compose up -d --scale worker=4 worker
  #
  # Memory on this box is the limit: ~1584 MB free, ~300 MB per worker.
  worker:
    image: chronomark-backend:latest
    env_file:
      - ./backend/.env
    environment:
      WORKER_CONCURRENCY: "1"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/queue:/app/queue
      - ./backend/jobs:/app/jobs
      - ./backend/audio:/app/audio
      - ./backend/frames:/app/frames
      - ./backend/documents:/app/documents
      - ./backend/chats:/app/chats
      - ./cookies.txt:/app/cookies.txt
      - ./backend/secrets:/app/secrets:ro
      - hf_cache:/cache/huggingface
    command: ["python", "worker.py"]
    # The backend's healthcheck probes uvicorn on :8000; a worker serves no
    # HTTP, so it would report unhealthy forever.
    healthcheck:
      disable: true
    # A runaway job must not take the API down with it.
    mem_limit: 900m
    deploy:
      replicas: 2
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin API behind Caddy: https://chronomark.0digital.xyz/api/*
        # proxies to backend:8000 with the /api prefix stripped. Requires the
        # chronomark.0digital.xyz DNS record -> 62.238.121.168 and a frontend
        # image rebuild (docker compose build frontend) once DNS exists.
        # Until then the previous bundle (http://62.238.121.168:37712) keeps
        # working on :8080.
        VITE_API_URL: "https://chronomark.0digital.xyz/api"
    container_name: chronomark-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare WARP as a free egress for yt-dlp ONLY: YouTube bot-checks
  # datacenter IPs ("Sign in to confirm you're not a bot"). Pointing
  # YT_DLP_PROXY=socks5://warp:1080 in backend/.env routes the downloader
  # through Cloudflare's exit IP; nothing else uses it. Needs NET_ADMIN +
  # the TUN device (KVM VPS). Free WARP, no account.
  warp:
    image: caomingjun/warp
    container_name: chronomark-warp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv4.conf.all.src_valid_mark=1
    expose:
      - "1080"

volumes:
  hf_cache:
